<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5b6b8c"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:24px;font-weight:700}.s{font-size:17px}.b{fill:#f5f7fb;stroke:#60749c;stroke-width:2}.e{stroke:#5b6b8c;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#d08435;stroke-width:2;stroke-dasharray:8 6;fill:none;marker-end:url(#a)}</style></defs>
  <text x="40" y="42" class="t">Dolma Toolkit：文档流、属性流与版本化配方</text>
  <g class="s" text-anchor="middle"><rect class="b" x="35" y="105" width="180" height="92" rx="12"/><text x="125" y="140">原始 JSONL</text><text x="125" y="170">source + id + text</text><rect class="b" x="270" y="105" width="180" height="92" rx="12"/><text x="360" y="140">Tagger</text><text x="360" y="170">属性与 span</text><rect class="b" x="505" y="105" width="180" height="92" rx="12"/><text x="595" y="140">过滤 / 去重</text><text x="595" y="170">规则与 Bloom filter</text><rect class="b" x="740" y="105" width="180" height="92" rx="12"/><text x="830" y="140">Mixer</text><text x="830" y="170">来源权重与版本</text><rect class="b" x="975" y="105" width="190" height="92" rx="12"/><text x="1070" y="140">训练语料</text><text x="1070" y="170">shard + manifest</text></g>
  <path class="e" d="M215 151H267"/><path class="e" d="M450 151H502"/><path class="e" d="M685 151H737"/><path class="e" d="M920 151H972"/>
  <rect class="b" x="300" y="285" width="600" height="82" rx="12"/><text x="600" y="319" class="s" text-anchor="middle">统计与审计：输入量、命中量、删除原因、来源占比、版本标识</text><text x="600" y="347" class="s" text-anchor="middle">属性是证据；阈值与混合比例属于具体配方</text>
