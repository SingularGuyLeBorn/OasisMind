<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315b7d"/></marker></defs><rect width="900" height="360" fill="white"/><text x="450" y="32" text-anchor="middle" font-size="21" font-weight="700">EWC 参数约束与 LwF 输出约束</text><ellipse cx="205" cy="190" rx="145" ry="58" fill="#e9f3ff" stroke="#315b7d" stroke-width="2" transform="rotate(-24 205 190)"/><circle cx="165" cy="205" r="7" fill="#18344a"/><text x="120" y="230" font-size="15">旧参数 θ*</text><circle cx="285" cy="125" r="7" fill="#c54b4b"/><text x="300" y="125" font-size="15">新任务最优点</text><path d="M171 201L270 134" stroke="#315b7d" stroke-width="3" marker-end="url(#a)"/><text x="150" y="295" font-size="15">Fisher 大的方向：移动惩罚强</text><rect x="500" y="90" width="145" height="62" rx="9" fill="#eef8f0" stroke="#3d7650" stroke-width="2"/><text x="572" y="116" text-anchor="middle" font-size="15">旧模型 logits</text><text x="572" y="138" text-anchor="middle" font-size="14">温度 T 软化</text><rect x="500" y="225" width="145" height="62" rx="9" fill="#fff3e6" stroke="#a86a25" stroke-width="2"/><text x="572" y="252" text-anchor="middle" font-size="15">新模型 logits</text><text x="572" y="274" text-anchor="middle" font-size="14">新任务输入</text><path d="M650 121H760V252H650" fill="none" stroke="#315b7d" stroke-width="2"/><text x="775" y="180" font-size="15">蒸馏距离</text><text x="775" y="203" font-size="15">约束函数变化</text><text x="450" y="337" text-anchor="middle" font-size="14" fill="#536878">EWC 在参数空间设置各向异性二次惩罚；LwF 在新输入上保持旧类别输出分布。</text></svg>
