<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc">
  <title id="title">滑动窗口、全局节点与随机长边</title><desc id="desc">八个位置组成的三种静态稀疏图。</desc>
  <rect width="1080" height="430" fill="#f8fafc"/><style>text{font-family:"Microsoft YaHei",Arial,sans-serif;fill:#172033}.h{font-size:22px;font-weight:700}.s{font-size:15px;fill:#475569}.node{fill:#fff;stroke:#334155;stroke-width:2}.global{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.local{stroke:#94a3b8;stroke-width:3}.far{stroke:#f97316;stroke-width:3}.gline{stroke:#2563eb;stroke-width:2}</style>
  <text x="35" y="42" class="h">局部窗口</text><text x="385" y="42" class="h">局部窗口 + 全局节点</text><text x="760" y="42" class="h">局部窗口 + 随机长边</text>
  <g transform="translate(35 92)"><path d="M30 80H310" class="local"/><g id="row"><circle cx="30" cy="80" r="14" class="node"/><circle cx="70" cy="80" r="14" class="node"/><circle cx="110" cy="80" r="14" class="node"/><circle cx="150" cy="80" r="14" class="node"/><circle cx="190" cy="80" r="14" class="node"/><circle cx="230" cy="80" r="14" class="node"/><circle cx="270" cy="80" r="14" class="node"/><circle cx="310" cy="80" r="14" class="node"/></g><text x="25" y="220" class="s">远距信息依靠跨层逐段传播</text></g>
  <g transform="translate(385 92)"><path d="M30 80H310" class="local"/><circle cx="170" cy="170" r="18" class="global"/><path d="M30 80L170 170M70 80L170 170M110 80L170 170M150 80L170 170M190 80L170 170M230 80L170 170M270 80L170 170M310 80L170 170" class="gline"/><circle cx="30" cy="80" r="14" class="node"/><circle cx="70" cy="80" r="14" class="node"/><circle cx="110" cy="80" r="14" class="node"/><circle cx="150" cy="80" r="14" class="node"/><circle cx="190" cy="80" r="14" class="node"/><circle cx="230" cy="80" r="14" class="node"/><circle cx="270" cy="80" r="14" class="node"/><circle cx="310" cy="80" r="14" class="node"/><text x="20" y="230" class="s">全局位置承担固定的信息汇聚接口</text></g>
  <g transform="translate(745 92)"><path d="M30 80H310" class="local"/><path d="M30 80Q170 0 310 80M70 80Q170 160 270 80M110 80Q190 25 270 80" fill="none" class="far"/><circle cx="30" cy="80" r="14" class="node"/><circle cx="70" cy="80" r="14" class="node"/><circle cx="110" cy="80" r="14" class="node"/><circle cx="150" cy="80" r="14" class="node"/><circle cx="190" cy="80" r="14" class="node"/><circle cx="230" cy="80" r="14" class="node"/><circle cx="270" cy="80" r="14" class="node"/><circle cx="310" cy="80" r="14" class="node"/><text x="5" y="220" class="s">长边缩短部分节点对的图距离</text></g>
</svg>
