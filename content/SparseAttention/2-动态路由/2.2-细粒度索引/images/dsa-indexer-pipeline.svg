<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">DSA 索引器与 Sparse MLA 的两阶段计算</title>
  <desc id="desc">Lightning Indexer 使用低维查询和共享索引键召回历史 token，top-k 只输出位置，Sparse MLA 再读取完整 latent KV 并重新计算注意力权重。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <style>
      .title{font:700 28px system-ui,"Microsoft YaHei",sans-serif;fill:#0f172a}.label{font:700 20px system-ui,"Microsoft YaHei",sans-serif;fill:#0f172a}.body{font:16px system-ui,"Microsoft YaHei",sans-serif;fill:#334155}.small{font:14px system-ui,"Microsoft YaHei",sans-serif;fill:#475569}.box{stroke-width:2}.arrow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="620" rx="24" fill="#f8fafc"/>
  <text x="52" y="55" class="title">DSA：索引分数只负责召回，主注意力仍负责精算</text>

  <rect x="55" y="105" width="210" height="145" rx="18" fill="#dbeafe" stroke="#2563eb" class="box"/>
  <text x="80" y="145" class="label">当前 query</text>
  <text x="80" y="180" class="body">hidden state  hₜ</text>
  <text x="80" y="212" class="small">生成多头低维 qᴵₜ,ⱼ</text>
  <text x="80" y="235" class="small">以及 query 相关权重 wᴵₜ,ⱼ</text>

  <rect x="55" y="345" width="210" height="145" rx="18" fill="#ecfeff" stroke="#0891b2" class="box"/>
  <text x="80" y="385" class="label">全部历史 token</text>
  <text x="80" y="420" class="body">共享低维索引键 kᴵₛ</text>
  <text x="80" y="452" class="small">扫描范围仍是完整历史</text>
  <text x="80" y="475" class="small">不等于主 attention 的 K</text>

  <path d="M265 178H340" class="arrow"/><path d="M265 418H315Q340 418 340 393V225" class="arrow"/>
  <rect x="340" y="145" width="240" height="185" rx="18" fill="#ede9fe" stroke="#7c3aed" class="box"/>
  <text x="370" y="185" class="label">Lightning Indexer</text>
  <text x="370" y="222" class="body">低维点积 → ReLU</text>
  <text x="370" y="252" class="body">多头加权求和</text>
  <text x="370" y="287" class="small">得到每个历史位置的标量 Iₜ,ₛ</text>
  <text x="370" y="312" class="small">此处没有 Value，也不输出上下文</text>

  <path d="M580 237H650" class="arrow"/>
  <rect x="650" y="145" width="190" height="185" rx="18" fill="#ffedd5" stroke="#ea580c" class="box"/>
  <text x="692" y="185" class="label">Top-k</text>
  <text x="680" y="222" class="body">因果遮罩后排序</text>
  <text x="680" y="252" class="body">输出位置集合 Sₜ</text>
  <text x="680" y="287" class="small">分数完成任务后退出</text>
  <text x="680" y="312" class="small">例如 k = 2048</text>

  <path d="M840 237H910" class="arrow"/>
  <rect x="910" y="105" width="235" height="270" rx="18" fill="#dcfce7" stroke="#16a34a" class="box"/>
  <text x="942" y="148" class="label">Sparse MLA</text>
  <text x="942" y="188" class="body">按 Sₜ gather latent KV</text>
  <text x="942" y="220" class="body">使用完整主 QK 表示</text>
  <text x="942" y="252" class="body">重新计算 softmax</text>
  <line x1="940" y1="278" x2="1115" y2="278" stroke="#86efac" stroke-width="2"/>
  <text x="942" y="310" class="small">Indexer 分数不进入</text>
  <text x="942" y="334" class="small">主 attention 权重</text>

  <rect x="340" y="390" width="805" height="145" rx="18" fill="#fff" stroke="#cbd5e1" class="box"/>
  <text x="370" y="430" class="label">为什么要分成两套表示？</text>
  <text x="370" y="466" class="body">索引表示追求低维、低精度和高召回；主 MLA 表示保留真正用于输出的注意力几何。</text>
  <text x="370" y="500" class="body">漏选的 token 无法在精算阶段补回，因此训练首先对齐 selector，再让模型适应稀疏连接图。</text>
  <path d="M1025 375V390" class="arrow"/>
  <text x="55" y="585" class="small">读图重点：降低主 attention 的计算量，不等于消除全历史扫描；当上下文继续变长，indexer 本身可能成为新的瓶颈。</text>
</svg>
