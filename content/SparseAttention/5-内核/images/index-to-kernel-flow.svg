<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">候选索引到稀疏 attention kernel</title><desc id="desc">候选经过合并去重排序，映射成BSR和物理页地址，装载KV tile，执行在线softmax，输出结果，workspace承载调度与部分输出。</desc>
  <defs><style>.bg{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.i{fill:#fef3c7;stroke:#b45309}.m{fill:#e0f2fe;stroke:#0369a1}.k{fill:#dcfce7;stroke:#15803d}.w{fill:#f3e8ff;stroke:#7e22ce}.t{font:700 21px 'Microsoft YaHei',sans-serif;fill:#0f172a}.s{font:16px 'Microsoft YaHei',sans-serif;fill:#334155}.a{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#475569"/></marker></defs>
  <rect class="bg" width="1200" height="620" rx="24"/><text class="t" x="45" y="50">从逻辑候选到 GPU 稀疏执行</text>
  <rect class="b i" x="45" y="180" width="180" height="120" rx="14"/><text class="t" x="78" y="220">候选索引</text><text class="s" x="72" y="252">window / sink</text><text class="s" x="75" y="278">dynamic top-k</text>
  <rect class="b i" x="275" y="180" width="190" height="120" rx="14"/><text class="t" x="310" y="220">规范化</text><text class="s" x="303" y="252">合并 · 去重 · 排序</text><text class="s" x="315" y="278">token → block</text>
  <rect class="b m" x="515" y="180" width="190" height="120" rx="14"/><text class="t" x="548" y="220">地址生成</text><text class="s" x="545" y="252">BSR / block table</text><text class="s" x="555" y="278">物理页 + offset</text>
  <rect class="b k" x="755" y="130" width="200" height="220" rx="14"/><text class="t" x="790" y="175">Sparse Kernel</text><text class="s" x="793" y="212">装载 Q / K / V tile</text><text class="s" x="795" y="244">QK 与 causal mask</text><text class="s" x="791" y="276">online max / sum</text><text class="s" x="803" y="308">PV 累积输出</text>
  <rect class="b" x="1000" y="180" width="150" height="120" rx="14"/><text class="t" x="1043" y="225">输出</text><text class="s" x="1022" y="260">O 与 log-sum-exp</text>
  <path class="a" d="M225 240H275"/><path class="a" d="M465 240H515"/><path class="a" d="M705 240H755"/><path class="a" d="M955 240H1000"/>
  <rect class="b w" x="430" y="430" width="430" height="115" rx="14"/><text class="t" x="565" y="470">Workspace</text><text class="s" x="468" y="505">调度表 · ragged offset · split-KV 部分输出</text><path class="a" d="M645 430V355"/>
</svg>
