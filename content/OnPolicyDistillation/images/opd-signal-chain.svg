<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect width="1200" height="620" fill="#fbfaf7"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .title{font:700 28px sans-serif;fill:#172033}.box{fill:#fff;stroke:#64748b;stroke-width:2;rx:16}.accent{fill:#eef6ff;stroke:#2563eb}.warm{fill:#fff6e8;stroke:#d97706}.green{fill:#eefbf3;stroke:#15803d}.txt{font:600 21px sans-serif;fill:#172033}.sub{font:17px sans-serif;fill:#475569}.line{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="50" y="50" class="title">OPD 的信号链：每一步都可能改变算法含义</text>
  <rect x="50" y="105" width="230" height="125" class="box accent"/>
  <text x="165" y="145" text-anchor="middle" class="txt">学生产生状态</text>
  <text x="165" y="178" text-anchor="middle" class="sub">当前 / 近当前 / 历史策略</text>
  <text x="165" y="205" text-anchor="middle" class="sub">前缀与环境观察</text>
  <rect x="350" y="105" width="230" height="125" class="box warm"/>
  <text x="465" y="145" text-anchor="middle" class="txt">教师读取状态</text>
  <text x="465" y="178" text-anchor="middle" class="sub">同一前缀 + 可选特权信息</text>
  <text x="465" y="205" text-anchor="middle" class="sub">教师参数停止梯度</text>
  <rect x="650" y="105" width="230" height="125" class="box"/>
  <text x="765" y="145" text-anchor="middle" class="txt">反馈接口</text>
  <text x="765" y="178" text-anchor="middle" class="sub">完整词表 / top-k / 采样动作</text>
  <text x="765" y="205" text-anchor="middle" class="sub">结果、批评或工具反馈</text>
  <rect x="950" y="105" width="200" height="125" class="box green"/>
  <text x="1050" y="145" text-anchor="middle" class="txt">估计器更新</text>
  <text x="1050" y="178" text-anchor="middle" class="sub">局部 KL / 优势</text>
  <text x="1050" y="205" text-anchor="middle" class="sub">回报与重要性修正</text>
  <path d="M280 168 L350 168" class="line"/><path d="M580 168 L650 168" class="line"/><path d="M880 168 L950 168" class="line"/>
  <rect x="70" y="315" width="310" height="190" class="box accent"/>
  <text x="225" y="355" text-anchor="middle" class="txt">状态轴</text>
  <text x="95" y="395" class="sub">• 谁生成被监督前缀？</text>
  <text x="95" y="430" class="sub">• 轨迹与 learner 相差多远？</text>
  <text x="95" y="465" class="sub">• 外部环境是否完全一致？</text>
  <rect x="445" y="315" width="310" height="190" class="box warm"/>
  <text x="600" y="355" text-anchor="middle" class="txt">信息轴</text>
  <text x="470" y="395" class="sub">• 教师多看见了什么？</text>
  <text x="470" y="430" class="sub">• 压缩接口丢掉哪些候选？</text>
  <text x="470" y="465" class="sub">• 反馈能否区分可恢复状态？</text>
  <rect x="820" y="315" width="310" height="190" class="box green"/>
  <text x="975" y="355" text-anchor="middle" class="txt">信用轴</text>
  <text x="845" y="395" class="sub">• 信号只作用当前 token 吗？</text>
  <text x="845" y="430" class="sub">• 概率应转移给哪个动作？</text>
  <text x="845" y="465" class="sub">• 结果怎样传回早期岔路？</text>
  <path d="M1050 230 C1050 275 975 275 975 315" class="line"/>
  <path d="M165 230 C165 275 225 275 225 315" class="line"/>
  <path d="M765 230 C765 275 600 275 600 315" class="line"/>
  <text x="600" y="565" text-anchor="middle" class="sub">同名算法也可能落在不同坐标；三根轴共同决定比较口径。</text>
</svg>
