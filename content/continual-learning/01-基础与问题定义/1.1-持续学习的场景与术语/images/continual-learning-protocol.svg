<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#576d91"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:24px;font-weight:700}.s{font-size:16px}.b{fill:#f4f7fc;stroke:#60749c;stroke-width:2}.e{stroke:#576d91;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#c57b33;stroke-width:2;stroke-dasharray:8 6;fill:none;marker-end:url(#a)}</style></defs>
  <text x="40" y="42" class="t">持续学习实验：数据流、训练权限、状态预算与推理协议</text>
  <g class="s" text-anchor="middle"><rect class="b" x="40" y="95" width="180" height="90" rx="12"/><text x="130" y="128">顺序数据流</text><text x="130" y="156">D₁ → D₂ → … → Dₜ</text><rect class="b" x="270" y="95" width="200" height="90" rx="12"/><text x="370" y="128">训练协议</text><text x="370" y="156">单遍/多轮、边界</text><rect class="b" x="520" y="95" width="200" height="90" rx="12"/><text x="620" y="128">模型更新</text><text x="620" y="156">θ₁ → θ₂ → … → θₜ</text><rect class="b" x="770" y="95" width="200" height="90" rx="12"/><text x="870" y="128">推理协议</text><text x="870" y="156">任务 ID、输出空间</text><rect class="b" x="1020" y="95" width="145" height="90" rx="12"/><text x="1092" y="128">逐任务测试</text><text x="1092" y="156">aₖ,ⱼ</text></g>
  <path class="e" d="M220 140H267"/><path class="e" d="M470 140H517"/><path class="e" d="M720 140H767"/><path class="e" d="M970 140H1017"/>
  <rect class="b" x="270" y="275" width="450" height="105" rx="12"/><text x="495" y="310" class="s" text-anchor="middle">跨阶段状态预算</text><text x="495" y="340" class="s" text-anchor="middle">样本 / logits / Fisher / 旧模型 / 优化器 / 专属参数</text><text x="495" y="365" class="s" text-anchor="middle">容量和字节数必须与准确率一起报告</text><path class="d" d="M495 272V190"/>
  <rect class="b" x="795" y="275" width="370" height="105" rx="12"/><text x="980" y="310" class="s" text-anchor="middle">准确率矩阵 A</text><text x="980" y="340" class="s" text-anchor="middle">下三角：保持；对角线：即时学习</text><text x="980" y="365" class="s" text-anchor="middle">上三角：未见任务迁移</text><path class="e" d="M1092 188V272"/>
  <text x="600" y="450" class="s" text-anchor="middle">Task-IL、Domain-IL、Class-IL 的差别主要落在推理协议，而不只是数据集名称</text>
</svg>
