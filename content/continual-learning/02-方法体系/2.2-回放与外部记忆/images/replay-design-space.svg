<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#576d91"/></marker><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:24px;font-weight:700}.s{font-size:16px}.b{fill:#f4f7fc;stroke:#60749c;stroke-width:2}.e{stroke:#576d91;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#c57b33;stroke-width:2;stroke-dasharray:8 6;fill:none;marker-end:url(#a)}</style></defs>
  <text x="40" y="42" class="t">回放设计空间：写入什么、保存什么、训练时怎样使用</text>
  <g class="s" text-anchor="middle"><rect class="b" x="40" y="105" width="190" height="95" rx="12"/><text x="135" y="138">顺序数据流</text><text x="135" y="168">(x, y)ₜ</text><rect class="b" x="285" y="105" width="220" height="95" rx="12"/><text x="395" y="138">写入策略</text><text x="395" y="168">reservoir / 类均衡</text><rect class="b" x="560" y="75" width="230" height="75" rx="12"/><text x="675" y="108">样本 + 标签</text><text x="675" y="133">ER / iCaRL</text><rect class="b" x="560" y="175" width="230" height="75" rx="12"/><text x="675" y="208">样本 + 历史 logits</text><text x="675" y="233">DER / DER++</text><rect class="b" x="560" y="275" width="230" height="75" rx="12"/><text x="675" y="308">生成器参数</text><text x="675" y="333">DGR</text><rect class="b" x="865" y="75" width="280" height="75" rx="12"/><text x="1005" y="108">直接优化旧样本损失</text><text x="1005" y="133">监督回放</text><rect class="b" x="865" y="175" width="280" height="75" rx="12"/><text x="1005" y="208">约束旧函数或梯度</text><text x="1005" y="233">蒸馏 / GEM / A-GEM</text><rect class="b" x="865" y="275" width="280" height="75" rx="12"/><text x="1005" y="308">生成伪历史数据</text><text x="1005" y="333">联合当前数据训练</text></g>
  <path class="e" d="M230 152H282"/><path class="e" d="M505 135L557 112"/><path class="e" d="M505 160L557 212"/><path class="d" d="M395 203V312H557"/><path class="e" d="M790 112H862"/><path class="e" d="M790 212H862"/><path class="e" d="M790 312H862"/>
  <rect class="b" x="285" y="410" width="860" height="70" rx="12"/><text x="715" y="440" class="s" text-anchor="middle">公平计量：原始字节 + 标签/logits + 生成器或旧模型参数 + 额外前后向 + 隐私与删除成本</text><text x="715" y="465" class="s" text-anchor="middle">相同“样本数”并不代表相同信息量或计算预算</text>
