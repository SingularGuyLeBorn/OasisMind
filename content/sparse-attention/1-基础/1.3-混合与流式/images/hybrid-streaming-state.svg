<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid SWA 层表与 sink cache</title><desc id="desc">上方是局部层和全局层交替, 下方是 sink 槽和环形窗口。</desc>
  <rect width="1080" height="500" fill="#f8fafc"/><style>text{font-family:"Microsoft YaHei",Arial,sans-serif;fill:#172033}.h{font-size:23px;font-weight:700}.t{font-size:17px}.s{font-size:15px;fill:#475569}.local{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.global{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.sink{fill:#fee2e2;stroke:#dc2626;stroke-width:2}.win{fill:#fff;stroke:#64748b;stroke-width:2}.arrow{stroke:#64748b;stroke-width:2;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker></defs>
  <text x="40" y="45" class="h">层轴: 局部层控制大部分成本, 全局层恢复完整历史访问</text>
  <g transform="translate(55 75)"><rect x="0" y="0" width="185" height="60" rx="10" class="local"/><text x="54" y="37" class="t">局部层 1</text><path d="M185 30H225" class="arrow"/><rect x="225" y="0" width="185" height="60" rx="10" class="local"/><text x="279" y="37" class="t">局部层 2</text><path d="M410 30H450" class="arrow"/><rect x="450" y="0" width="185" height="60" rx="10" class="global"/><text x="504" y="37" class="t">全局层 3</text><path d="M635 30H675" class="arrow"/><rect x="675" y="0" width="185" height="60" rx="10" class="local"/><text x="729" y="37" class="t">局部层 4</text><text x="0" y="94" class="s">局部层 KV 长度约为 w</text><text x="450" y="94" class="s">全局层 KV 长度随 n 增长</text></g>
  <line x1="40" y1="205" x2="1040" y2="205" stroke="#cbd5e1" stroke-width="2"/>
  <text x="40" y="250" class="h">时间轴: sink 槽不覆盖, 最近窗口按逻辑位置滚动</text>
  <g transform="translate(55 290)"><rect x="0" y="0" width="100" height="74" rx="8" class="sink"/><text x="25" y="32" class="t">sink 1</text><text x="18" y="57" class="s">永久保留</text><rect x="112" y="0" width="100" height="74" rx="8" class="sink"/><text x="137" y="32" class="t">sink 2</text><text x="130" y="57" class="s">永久保留</text><rect x="250" y="0" width="120" height="74" rx="8" class="win"/><text x="284" y="44" class="t">t-w+1</text><rect x="382" y="0" width="120" height="74" rx="8" class="win"/><text x="429" y="44" class="t">...</text><rect x="514" y="0" width="120" height="74" rx="8" class="win"/><text x="561" y="44" class="t">t-1</text><rect x="646" y="0" width="120" height="74" rx="8" class="win"/><text x="700" y="44" class="t">t</text><path d="M766 37H840" class="arrow"/><rect x="850" y="0" width="120" height="74" rx="8" class="local"/><text x="881" y="32" class="t">新 token</text><text x="870" y="57" class="s">覆盖最旧普通槽</text><text x="250" y="111" class="s">窗口含 w 个普通位置; 物理槽复用, RoPE 仍跟随逻辑位置</text></g>
</svg>
