<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">稀疏注意力选择器训练数据流</title>
  <desc id="desc">输入分别进入稠密教师和低成本选择器，教师产生概率与oracle，选择器经过top-k产生候选，稀疏主干计算语言模型输出，多个损失共同训练。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.box{fill:#fff;stroke:#334155;stroke-width:2}.teacher{fill:#e0f2fe;stroke:#0369a1}.router{fill:#fef3c7;stroke:#b45309}.main{fill:#dcfce7;stroke:#15803d}.loss{fill:#f3e8ff;stroke:#7e22ce}.t{font:700 23px 'Microsoft YaHei',sans-serif;fill:#0f172a}.s{font:17px 'Microsoft YaHei',sans-serif;fill:#334155}.a{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#7e22ce;stroke-width:2.5;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker>
  </defs>
  <rect class="bg" width="1200" height="650" rx="24"/>
  <text class="t" x="48" y="52">选择器监督与联合训练</text>
  <rect class="box" x="55" y="260" width="170" height="90" rx="14"/>
  <text class="t" x="105" y="298">输入序列</text><text class="s" x="82" y="328">query / history</text>
  <rect class="box teacher" x="315" y="105" width="245" height="125" rx="16"/>
  <text class="t" x="370" y="145">稠密教师</text><text class="s" x="344" y="180">attention 概率 p</text><text class="s" x="351" y="207">oracle / 难负例</text>
  <rect class="box router" x="315" y="385" width="245" height="125" rx="16"/>
  <text class="t" x="350" y="425">低成本选择器</text><text class="s" x="345" y="461">代理分数 r → top-k</text><text class="s" x="353" y="489">固定候选预算 S</text>
  <rect class="box main" x="685" y="260" width="245" height="125" rx="16"/>
  <text class="t" x="725" y="300">稀疏主 attention</text><text class="s" x="718" y="337">只读取候选 K / V</text><text class="s" x="733" y="365">生成模型输出</text>
  <rect class="box loss" x="720" y="495" width="390" height="105" rx="16"/>
  <text class="t" x="795" y="535">联合目标</text><text class="s" x="750" y="571">LM + KL + 排序 + 预算约束</text>
  <path class="a" d="M225 292 C265 250 275 180 315 170"/><path class="a" d="M225 320 C270 360 275 430 315 445"/>
  <path class="a" d="M560 447 C620 447 625 340 685 330"/>
  <path class="dash" d="M560 175 C675 175 650 490 760 520"/>
  <path class="dash" d="M560 470 C650 470 650 535 720 545"/>
  <path class="dash" d="M850 385 L885 495"/>
  <text class="s" x="580" y="425">候选索引</text><text class="s" x="586" y="151">教师监督</text>
  <text class="s" x="52" y="615">训练后期用部署粒度、共享规则、数值精度和预算回放整条路径</text>
</svg>
