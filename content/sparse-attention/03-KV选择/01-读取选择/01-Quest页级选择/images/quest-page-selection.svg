<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Quest 页级 KV 选择数据流</title><desc id="desc">写入时生成每页最小值和最大值摘要, 解码时用 query 给页排序并读取 Top-K 页。</desc>
  <rect width="1120" height="520" fill="#f8fafc"/><style>text{font-family:"Microsoft YaHei",Arial,sans-serif;fill:#172033}.h{font-size:23px;font-weight:700}.t{font-size:17px}.s{font-size:15px;fill:#475569}.page{fill:#fff;stroke:#64748b;stroke-width:2}.meta{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.sel{fill:#dcfce7;stroke:#16a34a;stroke-width:3}.skip{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:2}.q{fill:#fee2e2;stroke:#dc2626;stroke-width:2}.arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker></defs>
  <text x="40" y="42" class="h">写入路径: 完整 KV 与页摘要一起更新</text>
  <g transform="translate(40 70)"><rect x="0" y="0" width="180" height="68" rx="10" class="page"/><text x="49" y="31" class="t">KV page p</text><text x="34" y="54" class="s">S 个连续 token</text><path d="M180 34H235" class="arrow"/><rect x="235" y="0" width="235" height="68" rx="10" class="meta"/><text x="276" y="30" class="t">逐维 min / max</text><text x="260" y="54" class="s">每个 layer 与 head 独立</text><path d="M470 34H525" class="arrow"/><rect x="525" y="0" width="210" height="68" rx="10" class="page"/><text x="562" y="30" class="t">分页 KV cache</text><text x="551" y="54" class="s">完整状态仍然保留</text></g>
  <line x1="40" y1="180" x2="1080" y2="180" stroke="#cbd5e1" stroke-width="2"/>
  <text x="40" y="225" class="h">Decode 路径: 小索引扫描 → Top-K 页号 → 候选页精确 attention</text>
  <g transform="translate(40 260)"><rect x="0" y="0" width="120" height="66" rx="10" class="q"/><text x="36" y="39" class="t">query q</text><path d="M120 33H175" class="arrow"/><rect x="175" y="0" width="220" height="66" rx="10" class="meta"/><text x="202" y="29" class="t">扫描全部页摘要</text><text x="207" y="52" class="s">计算上界 U_p(q)</text><path d="M395 33H450" class="arrow"/><rect x="450" y="0" width="150" height="66" rx="10" class="meta"/><text x="489" y="39" class="t">Top-K</text><path d="M600 33H655" class="arrow"/><rect x="655" y="0" width="205" height="66" rx="10" class="sel"/><text x="682" y="29" class="t">读取候选 K / V</text><text x="691" y="52" class="s">页内精确 attention</text></g>
  <g transform="translate(40 375)"><rect x="0" y="0" width="150" height="62" rx="8" class="sel"/><text x="42" y="37" class="t">候选页 3</text><rect x="170" y="0" width="150" height="62" rx="8" class="skip"/><text x="201" y="37" class="t">未选页 4</text><rect x="340" y="0" width="150" height="62" rx="8" class="sel"/><text x="382" y="37" class="t">候选页 8</text><rect x="510" y="0" width="150" height="62" rx="8" class="skip"/><text x="541" y="37" class="t">未选页 9</text><text x="700" y="25" class="s">未选页本步不读 HBM</text><text x="700" y="50" class="s">下一步仍可重新进入候选</text></g>
</svg>
