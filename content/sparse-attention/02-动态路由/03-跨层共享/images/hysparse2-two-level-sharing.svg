<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">HySparse2 两级 KV 共享</title><desc id="desc">Self-decoder full层通过KV Bridging向Cross-decoder full层提供状态，Cross-decoder层组内部再通过KV Reuse向多个稀疏层共享KV和token索引。</desc><defs><style>.bg{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.s{fill:#e0f2fe;stroke:#0369a1}.f{fill:#dcfce7;stroke:#15803d}.p{fill:#fef3c7;stroke:#b45309}.t{font:700 21px 'Microsoft YaHei',sans-serif;fill:#0f172a}.x{font:16px 'Microsoft YaHei',sans-serif;fill:#334155}.a{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#7e22ce;stroke-width:3;stroke-dasharray:8 7;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#475569"/></marker></defs><rect class="bg" width="1200" height="650" rx="24"/><text class="t" x="45" y="50">HySparse2：外层 Bridging，内层 Reuse</text><rect class="b s" x="55" y="150" width="260" height="300" rx="14"/><text class="t" x="102" y="195">Self-Decoder</text><rect class="b f" x="90" y="235" width="190" height="90" rx="12"/><text class="t" x="126" y="275">Full Layer</text><text class="x" x="112" y="302">hidden-state producer</text><rect class="b" x="90" y="350" width="190" height="65" rx="12"/><text class="x" x="120" y="389">Hybrid SWA layers</text><rect class="b p" x="420" y="235" width="210" height="110" rx="14"/><text class="t" x="458" y="275">KV Bridging</text><text class="x" x="450" y="308">层专属投影 Φⱼ</text><rect class="b" x="740" y="105" width="380" height="420" rx="14"/><text class="t" x="840" y="148">Cross-Decoder</text><rect class="b f" x="790" y="190" width="280" height="90" rx="12"/><text class="t" x="864" y="230">Full Layer</text><text class="x" x="823" y="257">oracle · global KV · indices</text><rect class="b p" x="790" y="320" width="280" height="75" rx="12"/><text class="t" x="844" y="363">Sparse Layer 1</text><rect class="b p" x="790" y="425" width="280" height="75" rx="12"/><text class="t" x="844" y="468">Sparse Layer N</text><path class="a" d="M315 280H420"/><path class="a" d="M630 290C680 290 690 235 790 235"/><path class="d" d="M930 280V320"/><path class="d" d="M930 395V425"/><text class="x" x="950" y="307">KV Reuse</text><text class="x" x="945" y="414">token indices</text><text class="x" x="430" y="560">Prefill 可在 Self-Decoder 后结束；Decode 仍运行 Cross-Decoder 并读取桥接历史</text></svg>
