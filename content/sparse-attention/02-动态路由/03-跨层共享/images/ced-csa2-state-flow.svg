<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">CED 与 CSA2 状态流</title><desc id="desc">因果编码器产生共享历史，层专属桥接投影形成解码器全局KV，CSA2层组由Full、Reindex和Reuse层依次建立、刷新与复用状态。</desc><defs><style>.bg{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.e{fill:#e0f2fe;stroke:#0369a1}.f{fill:#dcfce7;stroke:#15803d}.r{fill:#fef3c7;stroke:#b45309}.u{fill:#f3e8ff;stroke:#7e22ce}.t{font:700 21px 'Microsoft YaHei',sans-serif;fill:#0f172a}.s{font:16px 'Microsoft YaHei',sans-serif;fill:#334155}.a{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#475569"/></marker></defs><rect class="bg" width="1200" height="650" rx="24"/><text class="t" x="45" y="50">CED 决定状态来源，CSA2 决定层组刷新</text><rect class="b e" x="55" y="170" width="220" height="160" rx="14"/><text class="t" x="88" y="210">Causal Encoder</text><text class="s" x="90" y="248">prompt hidden states</text><text class="s" x="90" y="280">共享历史来源 Hᴱ</text><rect class="b" x="350" y="190" width="200" height="120" rx="14"/><text class="t" x="388" y="230">层专属桥接</text><text class="s" x="385" y="266">Wᴷ,l / Wⱽ,l</text><rect class="b f" x="635" y="105" width="180" height="120" rx="14"/><text class="t" x="680" y="145">Full</text><text class="s" x="660" y="180">KV · pool · top-k</text><rect class="b r" x="635" y="265" width="180" height="120" rx="14"/><text class="t" x="665" y="305">Reindex</text><text class="s" x="656" y="340">复用 KV · 刷新 top-k</text><rect class="b u" x="635" y="425" width="180" height="120" rx="14"/><text class="t" x="680" y="465">Reuse</text><text class="s" x="660" y="500">复用 KV 与 top-k</text><rect class="b" x="930" y="245" width="200" height="150" rx="14"/><text class="t" x="970" y="285">Sparse Attention</text><text class="s" x="962" y="323">读取 selected KV</text><text class="s" x="972" y="353">输出层组表示</text><path 