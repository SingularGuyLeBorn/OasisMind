<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650" role="img" aria-labelledby="title desc">
  <title id="title">NSA三分支训练与推理数据流</title>
  <desc id="desc">输入分别进入压缩、选择和滑窗分支，压缩权重生成块索引，三个输出经门控合并。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52606d"/></marker>
    <style>.box{rx:14;stroke-width:2}.t{font:600 20px system-ui,sans-serif;fill:#172b4d}.s{font:15px system-ui,sans-serif;fill:#334e68}.a{stroke:#52606d;stroke-width:2.2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1180" height="650" fill="#f7f9fc"/>
  <rect class="box" x="40" y="265" width="170" height="90" fill="#e8f1ff" stroke="#4c78a8"/>
  <text class="t" x="125" y="300" text-anchor="middle">层输入 X</text><text class="s" x="125" y="330" text-anchor="middle">B × N × d_model</text>
  <rect class="box" x="290" y="65" width="260" height="120" fill="#e7f7ef" stroke="#2f855a"/>
  <text class="t" x="420" y="102" text-anchor="middle">Compression</text><text class="s" x="420" y="132" text-anchor="middle">重叠窗口 → M个entries</text><text class="s" x="420" y="160" text-anchor="middle">全局attention权重 p_cmp</text>
  <rect class="box" x="290" y="265" width="260" height="120" fill="#fff4df" stroke="#d69e2e"/>
  <text class="t" x="420" y="302" text-anchor="middle">Selection</text><text class="s" x="420" y="332" text-anchor="middle">gather连续原始KV blocks</text><text class="s" x="420" y="360" text-anchor="middle">组内heads共享indices</text>
  <rect class="box" x="290" y="465" width="260" height="120" fill="#f1eafe" stroke="#805ad5"/>
  <text class="t" x="420" y="502" text-anchor="middle">Window</text><text class="s" x="420" y="532" text-anchor="middle">最近w个token</text><text class="s" x="420" y="560" text-anchor="middle">确定的局部路径</text>
  <rect class="box" x="650" y="185" width="230" height="100" fill="#fff" stroke="#2f855a"/>
  <text class="t" x="765" y="222" text-anchor="middle">Importance归约</text><text class="s" x="765" y="252" text-anchor="middle">空间映射 + GQA组内求和</text>
  <rect class="box" x="650" y="335" width="230" height="90" fill="#fff" stroke="#d69e2e"/>
  <text class="t" x="765" y="372" text-anchor="middle">Hard Top-n</text><text class="s" x="765" y="402" text-anchor="middle">离散block IDs</text>
  <rect class="box" x="950" y="265" width="190" height="115" fill="#e8f1ff" stroke="#4c78a8"/>
  <text class="t" x="1045" y="305" text-anchor="middle">Gate融合</text><text class="s" x="1045" y="335" text-anchor="middle">三个独立softmax输出</text><text class="s" x="1045" y="360" text-anchor="middle">→ o_t</text>
  <path class="a" d="M210 300 C245 250 250 130 290 125"/><path class="a" d="M210 310 L290 325"/><path class="a" d="M210 325 C245 390 250 510 290 525"/>
  <path class="a" d="M550 125 C600 125 610 215 650 225"/><path class="a" d="M765 285 L765 335"/><path class="a" d="M650 380 C610 380 600 340 550 335"/>
  <path class="a" d="M550 145 C790 95 900 220 950 285"/><path class="a" d="M550 325 L950 325"/><path class="a" d="M550 525 C790 565 900 420 950 360"/>
  <text class="s" x="688" y="112">p_cmp同时参与输出与路由</text>
  <text class="s" x="675" y="620">反向: 三个输出分支可微; Top-n索引固定后, selection只向入选blocks写回梯度</text>
</svg>
