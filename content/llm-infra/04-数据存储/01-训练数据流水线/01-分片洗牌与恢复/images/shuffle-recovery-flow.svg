<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700">
  <rect width="1280" height="700" fill="#0b1220"/>
  <style>.b{fill:#152238;stroke:#60a5fa;stroke-width:2;rx:13}.g{fill:#123328;stroke:#34d399;stroke-width:2;rx:13}.p{fill:#2b1d3d;stroke:#c084fc;stroke-width:2;rx:13}.o{fill:#3a2815;stroke:#f59e0b;stroke-width:2;rx:13}.t{fill:#f8fafc;font:600 20px sans-serif}.s{fill:#cbd5e1;font:15px sans-serif}.a{stroke:#94a3b8;stroke-width:3;fill:none;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#94a3b8"/></marker></defs>
  <text x="45" y="48" class="t">训练数据流水线与提交位置</text>
  <rect x="45" y="100" width="190" height="105" class="p"/><text x="67" y="140" class="t">Manifest</text><text x="67" y="172" class="s">版本 · checksum · 统计</text>
  <rect x="285" y="100" width="190" height="105" class="b"/><text x="307" y="140" class="t">Object / Shard</text><text x="307" y="172" class="s">range read · record 边界</text>
  <rect x="525" y="100" width="190" height="105" class="b"/><text x="547" y="140" class="t">Rank / Worker</text><text x="547" y="172" class="s">确定性分配 · 唯一性</text>
  <rect x="765" y="100" width="190" height="105" class="g"/><text x="787" y="140" class="t">Shuffle / Pack</text><text x="787" y="172" class="s">buffer · segment · mask</text>
  <rect x="1005" y="100" width="220" height="105" class="g"/><text x="1027" y="140" class="t">Batch / Prefetch</text><text x="1027" y="172" class="s">pinned memory · H2D</text>
  <path d="M235 152H285M475 152H525M715 152H765M955 152H1005" class="a"/>
  <rect x="1005" y="295" width="220" height="105" class="o"/><text x="1027" y="335" class="t">Forward / Backward</text><text x="1027" y="367" class="s">batch 已使用，尚未提交</text><path d="M1115 205V295" class="a"/>
  <rect x="765" y="295" width="190" height="105" class="p"/><text x="787" y="335" class="t">Optimizer Step</text><text x="787" y="367" class="s">成功更新形成提交边界</text><path d="M1005 347H955" class="a"/>
  <rect x="405" y="295" width="310" height="105" class="o"/><text x="427" y="335" class="t">Checkpoint Snapshot</text><text x="427" y="367" class="s">模型状态 + 数据提交状态</text><path d="M765 347H715" class="a"/>
  <rect x="45" y="500" width="1180" height="125" fill="#111827" stroke="#475569" stroke-width="2" rx="13"/>
  <text x="70" y="540" class="t">恢复原则</text><text x="70" y="576" class="s">丢弃在途 prefetch，从共同提交位置确定性重建；world size 改变时按稳定 work-unit id 重分配。</text><text x="70" y="606" class="s">吞吐验收与 sample-id 并集、交集、顺序哈希、packing mask 和故障恢复序列同时进行。</text>
</svg>
