<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">DDP、ZeRO 与 FSDP 的状态生命周期</title>
  <desc id="desc">比较完整副本、优化器分片、梯度分片和参数按需聚合的数据流。</desc>
  <style>
    text{font-family:"Microsoft YaHei",sans-serif;fill:#172033}.h{font-size:24px;font-weight:700}.t{font-size:18px}.s{font-size:15px;fill:#475569}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2}.param{fill:#dbeafe;stroke:#2563eb}.grad{fill:#dcfce7;stroke:#16a34a}.optim{fill:#fef3c7;stroke:#d97706}.arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <text x="40" y="42" class="h">一个 optimizer step 中，状态在哪里长期驻留，在哪里短暂聚合</text>
  <text x="45" y="100" class="t">DDP</text>
  <rect x="150" y="70" width="250" height="62" rx="10" class="box param"/><text x="175" y="107" class="t">每卡完整参数</text>
  <rect x="475" y="70" width="250" height="62" rx="10" class="box grad"/><text x="500" y="107" class="t">完整梯度 → all-reduce</text>
  <rect x="800" y="70" width="290" height="62" rx="10" class="box optim"/><text x="825" y="107" class="t">每卡完整 optimizer state</text>
  <path d="M400 101 H470 M725 101 H795" class="arrow"/>
  <text x="45" y="230" class="t">ZeRO-1/2</text>
  <rect x="150" y="200" width="250" height="62" rx="10" class="box param"/><text x="175" y="237" class="t">每卡完整参数</text>
  <rect x="475" y="200" width="250" height="62" rx="10" class="box grad"/><text x="500" y="237" class="t">梯度规约或分片</text>
  <rect x="800" y="200" width="290" height="62" rx="10" class="box optim"/><text x="825" y="237" class="t">optimizer state 按 rank 分片</text>
  <path d="M400 231 H470 M725 231 H795" class="arrow"/>
  <text x="45" y="370" class="t">ZeRO-3 / FSDP</text>
  <rect x="150" y="330" width="250" height="82" rx="10" class="box param"/><text x="175" y="365" class="t">参数分片常驻</text><text x="175" y="391" class="s">计算前 all-gather</text>
  <rect x="475" y="330" width="250" height="82" rx="10" class="box grad"/><text x="500" y="365" class="t">完整梯度短暂产生</text><text x="500" y="391" class="s">reduce-scatter 后只留分片</text>
  <rect x="800" y="330" width="290" height="82" rx="10" class="box optim"/><text x="825" y="365" class="t">本地更新所属分片</text><text x="825" y="391" class="s">下一层/下一步再按需聚合</text>
  <path d="M400 371 H470 M725 371 H795" class="arrow"/>
  <path d="M275 430 V505 H600 V417" class="arrow"/><text x="320" y="495" class="s">prefetch / unshard 把通信放进计算窗口</text>
  <text x="45" y="565" class="s">蓝色：参数　绿色：梯度　黄色：优化器状态。图中“完整”描述计算窗口内的逻辑视图，不表示必须长期复制。</text>
</svg>
