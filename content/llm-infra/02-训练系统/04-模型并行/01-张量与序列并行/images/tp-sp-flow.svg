<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">TP 与 SP 在 MLP 中的数据布局</title>
  <desc id="desc">序列分片输入经 all-gather 进入列并行层，沿隐藏维分片计算，再由行并行层和 reduce-scatter 返回序列分片布局。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.box{fill:#fff;stroke:#334155;stroke-width:2}.sp{fill:#dcfce7;stroke:#15803d;stroke-width:2}.tp{fill:#dbeafe;stroke:#1d4ed8;stroke-width:2}.comm{fill:#fef3c7;stroke:#b45309;stroke-width:2}.t{font:600 18px system-ui,sans-serif;fill:#0f172a}.s{font:15px system-ui,sans-serif;fill:#334155}.a{stroke:#475569;stroke-width:2.5;marker-end:url(#m)}
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
  </defs>
  <rect class="bg" width="1120" height="560" rx="18"/>
  <text class="t" x="40" y="48">TP=4：序列布局与隐藏维布局的往返</text>
  <rect class="sp" x="45" y="105" width="190" height="120" rx="12"/>
  <text class="t" x="70" y="145">序列分片</text><text class="s" x="70" y="178">[S/4, B, H]</text><text class="s" x="70" y="205">LN / residual 本地</text>
  <rect class="comm" x="280" y="120" width="145" height="90" rx="12"/>
  <text class="t" x="302" y="156">All-gather</text><text class="s" x="304" y="186">沿序列维</text>
  <rect class="tp" x="470" y="85" width="220" height="160" rx="12"/>
  <text class="t" x="495" y="125">Column Parallel</text><text class="s" x="495" y="158">输入 [S,B,H]</text><text class="s" x="495" y="185">输出 [S,B,F/4]</text><text class="s" x="495" y="215">激活函数本地</text>
  <rect class="tp" x="735" y="85" width="220" height="160" rx="12"/>
  <text class="t" x="770" y="125">Row Parallel</text><text class="s" x="760" y="158">输入 [S,B,F/4]</text><text class="s" x="760" y="185">局部和 [S,B,H]</text><text class="s" x="760" y="215">四卡贡献待规约</text>
  <line class="a" x1="235" y1="165" x2="277" y2="165"/><line class="a" x1="425" y1="165" x2="467" y2="165"/><line class="a" x1="690" y1="165" x2="732" y2="165"/>
  <rect class="comm" x="735" y="325" width="220" height="90" rx="12"/>
  <text class="t" x="775" y="360">Reduce-scatter</text><text class="s" x="782" y="391">求和并切序列</text>
  <rect class="sp" x="470" y="310" width="220" height="120" rx="12"/>
  <text class="t" x="510" y="350">序列分片输出</text><text class="s" x="520" y="382">[S/4, B, H]</text><text class="s" x="500" y="410">dropout / residual 本地</text>
  <line class="a" x1="845" y1="245" x2="845" y2="322"/><line class="a" x1="735" y1="370" x2="693" y2="370"/>
  <text class="s" x="45" y="500">纯 TP：RowParallel 出口 all-reduce，区外每卡保存完整 [S,B,H]</text>
  <text class="s" x="45" y="530">TP+SP：把 all-reduce 拆成 RS + 下一入口 AG，区外只保存 [S/4,B,H]</text>
</svg>
