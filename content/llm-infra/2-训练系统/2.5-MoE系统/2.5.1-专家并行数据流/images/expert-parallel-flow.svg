<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">专家并行数据流</title><desc id="desc">Token 经 router、top-k、permute、all-to-all、grouped GEMM、combine 和 unpermute 返回原顺序。</desc><defs><style>.bg{fill:#f8fafc}.b{fill:#dbeafe;stroke:#1d4ed8;stroke-width:2}.g{fill:#dcfce7;stroke:#15803d;stroke-width:2}.o{fill:#fef3c7;stroke:#b45309;stroke-width:2}.t{font:600 16px system-ui,sans-serif;fill:#0f172a}.s{font:13px system-ui,sans-serif;fill:#334155}.l{stroke:#475569;stroke-width:2;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#475569"/></marker></defs><rect class="bg" width="1200" height="520" rx="18"/><text class="t" x="35" y="42">MoE forward：token assignment 的往返</text>
<g transform="translate(30,90)"><rect class="b" width="130" height="90" rx="10"/><text class="t" x="32" y="35">Router</text><text class="s" x="18" y="64">[N,H]→[N,E]</text><rect class="b" x="165" width="130" height="90" rx="10"/><text class="t" x="205" y="35">Top-k</text><text class="s" x="188" y="64">[N,K] id/prob</text><rect class="o" x="330" width="140" height="90" rx="10"/><text class="t" x="368" y="35">Permute</text><text class="s" x="347" y="64">[NK,H] expert段</text><rect class="o" x="505" width="140" height="90" rx="10"/><text class="t" x="535" y="35">Dispatch</text><text class="s" x="530" y="64">All-to-all</text><rect class="g" x="680" width="150" height="90" rx="10"/><text class="t" x="700" y="35">Grouped GEMM</text><text class="s" x="700" y="64">[cₑ,H]→[cₑ,H]</text><rect class="o" x="865" width="130" height="90" rx="10"/><text class="t" x="900" y="35">Combine</text><text class="s" x="890" y="64">逆 All-to-all</text><rect class="b" x="1030" width="130" height="90" rx="10"/><text class="t" x="1052" y="35">Unpermute</text><text class="s" x="1050" y="64">加权回 [N,H]</text>
<path class="l" d="M130 45H160M295 45H325M470 45H500M645 45H675M830 45H860M995 45H1025"/></g>
<text class="t" x="45" y="260">关键状态</text><rect class="b" x="45" y="290" width="250" height="110" rx="12"/><text class="s" x="68" y="325">token id + top-k slot</text><text class="s" x="68" y="355">expert id + gate weight</text><text class="s" x="68" y="385">inverse permutation</text><rect class="o" x="360" y="290" width="250" height="110" rx="12"/><text class="s" x="390" y="325">input/output splits</text><text class="s" x="390" y="355">peer matrix + capacity</text><text class="s" x="390" y="385">dispatch/combine handle</text><rect class="g" x="675" y="290" width="250" height="110" rx="12"/><text class="s" x="705" y="325">每 expert token count cₑ</text><text class="s" x="705" y="355">offset / padded capacity</text><text class="s" x="705" y="385">Grouped GEMM shapes</text><text class="s" x="45" y="470">Backward 沿逆路径返回 input gradient；expert 参数梯度留在 owner，再进入对应 DP 同步组。</text></svg>
